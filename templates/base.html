<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrewSite | {{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">BrewSite</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('brewery') }}" class="{{ 'active' if request.endpoint == 'brewery' }}">Breweries</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>BrewSite, built with Flask and Jinja by Zack Scarlott for ICT 362.</p>
  </footer>
</body>
</html>
